[package]
name = "studiovd"
version = "0.2.2"
description = "StudioVD: 3D CAD assembly visualizer and multi-domain simulator"
authors = []
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "studiovd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-dialog = "2.8.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tauri-plugin-single-instance = "2.5.3"
parry3d = "0.31"
# Phase 14 downloads (PLAN 4.7): the reqwest Tauri already locks, with rustls and the OS
# trust store; ring instead of aws-lc-rs (no cmake/NASM toolchain on Windows).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
minisign-verify = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util", "rt"] }
tokio-util = "0.7"
fs4 = "1.1"
# Phase 15.5: a log file in the app's log folder (rotated), panics and webview errors in it.
tauri-plugin-log = "2"
log = "0.4"


[target.'cfg(windows)'.dependencies]
# The Windows proxy settings, read ourselves (PLAN 4.7: hyper-util misreads per-protocol values).
winreg = "0.56"

[dev-dependencies]
# Test signatures: minisign's prehashed mode is Ed25519 (ring) over BLAKE2b-512.
ring = "0.17"
blake2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# The single-instance plugin's own D-Bus library: used only to validate the session bus
# address the way the plugin will parse it (it panics on one it cannot).
zbus = "5.19"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
